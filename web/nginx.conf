# Nginx del contenedor `web`. Delante está el Caddy compartido del VPS, que
# pone TLS, HSTS y la CSP; aquí van las cabeceras que tienen sentido aunque
# la imagen se levante sola (docker compose en local, un escaneo, etc.).

server_tokens off;

server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;
    charset     utf-8;

    # Para el HEALTHCHECK: no toca disco ni ensucia el log de acceso.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Los assets llevan hash en el nombre: se pueden cachear sin miedo.
    # `add_header` dentro de un location anula los del server, por eso se
    # repiten las cabeceras de seguridad con el include.
    location /assets/ {
        include /etc/nginx/conf.d/seguridad.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/seguridad.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Archivos ocultos (.git, .env) nunca, aunque alguno se colara al build.
    location ~ /\. {
        deny all;
        return 404;
    }

    gzip            on;
    gzip_vary       on;
    gzip_types      text/css application/javascript image/svg+xml application/json font/woff;
    gzip_min_length 1024;
}
